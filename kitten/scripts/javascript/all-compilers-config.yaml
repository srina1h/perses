language: "JAVASCRIPT"
seedFolders:
  - path: "seeds"
    fileExtentions: [".js"]

programsUnderTest:
  # Unified ESHOST runner (exits 0 if all engines agree and expected; 1 otherwise)
  - command: "eshost"
    flagsToTest:
      - flags: ["-u"]
    versionFlags:
      flags: ["--version"]
    # Use any JS crash detector; eshost non-zero does not imply engine crash
    crashDetectorClassName: "org.perses.fuzzer.compilers.javascript.V8CrashDetector"
  
