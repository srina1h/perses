language: "JAVASCRIPT"
seedFolders:
  - path: "seeds"
    fileExtentions: [".js"]

programsUnderTest:
  # V8 JavaScript Engine
  - command: "v8"
    flagsToTest:
      - flags: []
    versionFlags:
      flags: ["--help"]
    crashDetectorClassName: "org.perses.fuzzer.compilers.javascript.V8CrashDetector"
  
  # SpiderMonkey JavaScript Engine
  - command: "spidermonkey"
    flagsToTest:
      - flags: []
    versionFlags:
      flags: ["--version"]
    crashDetectorClassName: "org.perses.fuzzer.compilers.javascript.SpiderMonkeyCrashDetector"
  
  # JavaScriptCore (JSC) Engine
  - command: "jsc"
    flagsToTest:
      - flags: []
    versionFlags:
      flags: ["--version"]
    crashDetectorClassName: "org.perses.fuzzer.compilers.javascript.JSCCrashDetector"
  
  # XS JavaScript Engine
  # - command: "xs"
  #   flagsToTest:
  #     - flags: []
  #   versionFlags:
  #     flags: ["-v"]
  #   crashDetectorClassName: "org.perses.fuzzer.compilers.javascript.XSCrashDetector"
  
  # GraalJS Engine
  - command: "graaljs"
    flagsToTest:
      - flags: []
    versionFlags:
      flags: ["--version"]
    crashDetectorClassName: "org.perses.fuzzer.compilers.javascript.GraalJSCrashDetector"
  
  # QuickJS Engine
